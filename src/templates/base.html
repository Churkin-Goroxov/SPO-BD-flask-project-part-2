<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Flask Project{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Мой Flask-проект</h1>

    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('about') }}">О проекте</a>
        <a href="{{ url_for('changelog') }}">Лог изменений</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    Flask Project
</footer>

</body>
</html>
